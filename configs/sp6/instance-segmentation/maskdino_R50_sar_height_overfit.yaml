_BASE_: maskdino_R50_scratch_bs2_acc8_100ep_height.yaml

# Two-image diagnostic run used to verify end-to-end height gradients and
# deliberate overfitting before launching the full server job.
DATASETS:
  SP6_MAX_TRAIN_IMAGES: 2
  TEST: ()

INPUT:
  RANDOM_FLIP: "none"

MODEL:
  ALIGN:
    SYNTHETIC_SHIFT_SUPERVISION: False

DATALOADER:
  NUM_WORKERS: 0

SOLVER:
  IMS_PER_BATCH: 1
  GRAD_ACCUMULATION_STEPS: 1
  BASE_LR: 0.0005
  MAX_ITER: 500
  STEPS: (400, 475)
  WARMUP_ITERS: 10
  CHECKPOINT_PERIOD: 100
  AMP:
    ENABLED: False

TEST:
  EVAL_PERIOD: 0

OUTPUT_DIR: "output/sp6_sar_height_scratch_overfit"
